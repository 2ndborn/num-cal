<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
    <title>Document</title>
</head>
<body>
    <button id="topBtn">Top</button>
    <div class="home-container">
        <div class="dob">
            <div class="day">
                <input type="text" id="day" inputmode="numeric" maxlength="2" required>
                <label for="">DD</label>
            </div>
            <div class="month">
                <input type="text" id="mon" inputmode="numeric" maxlength="2" required>
                <label for="">MM</label>
            </div>
            <div class="year">
                <input type="text" id="year" inputmode="numeric" maxlength="4" required>
                <label for="">YYYY</label>
            </div>
        </div>
        <div class="names">
            <input type="text" id="name-input" required>
            <label for="">Full Name</label>
        </div>
        <button id="btn" disabled>Calculate</button>
    </div>
    <div id="results">
        
    </div>
    <script type="module" src="assets/js/script.js"></script>
</body>
</html>
